<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="kp-t kp-d">
  <title id="kp-t">Kaizen pipeline</title>
  <desc id="kp-d">Six steps from left to right: Measure, Recommend, Choose, Apply, Verify, Undo. A dashed arrow labelled "a week later" leads from Verify back to Measure. Everything sits inside a dashed boundary tagged "runs on your machine".</desc>
  <defs>
    <style>
      .s{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
    <pattern id="kp-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#cbd5e1"/>
    </pattern>
    <marker id="kp-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.5L9 5L1.5 8.5Z" fill="#64748b" stroke="#64748b" stroke-width="1" stroke-linejoin="round"/>
    </marker>
    <marker id="kp-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.5L9 5L1.5 8.5Z" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="260" rx="18" fill="#f8fafc"/>
  <rect width="1200" height="260" rx="18" fill="url(#kp-dots)" opacity=".55"/>
  <rect x=".5" y=".5" width="1199" height="259" rx="17.5" fill="none" stroke="#e2e8f0"/>

  <!-- local-only boundary -->
  <rect x="20" y="26" width="1160" height="212" rx="16" fill="none" stroke="#0f766e" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="7 6"/>
  <g transform="translate(44 14)">
    <rect width="226" height="26" rx="13" fill="#f8fafc" stroke="#0f766e" stroke-opacity=".55" stroke-width="1.5"/>
    <rect x="16.5" y="7.5" width="12" height="8.5" rx="1.5" fill="none" stroke="#0f766e" stroke-width="1.6"/>
    <path d="M14 19.2H31" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round"/>
    <text class="m" x="40" y="18.5" font-size="14" font-weight="600" fill="#0f766e">runs on your machine</text>
  </g>

  <!-- the loop: Verify back to Measure, a week later -->
  <circle cx="885" cy="80" r="3.5" fill="#f59e0b"/>
  <path d="M885 80V70a14 14 0 0 0-14-14H139a14 14 0 0 0-14 14V77" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#kp-ah2)"/>
  <rect x="437" y="43" width="136" height="26" rx="13" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="454" cy="56" r="5.5" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <path d="M454 53V56.2L456.2 57.6" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="s" x="517" y="61" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle">a week later</text>

  <!-- arrows between steps -->
  <g fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round">
    <path d="M206 132H230" marker-end="url(#kp-ah)"/>
    <path d="M396 132H420" marker-end="url(#kp-ah)"/>
    <path d="M586 132H610" marker-end="url(#kp-ah)"/>
    <path d="M776 132H800" marker-end="url(#kp-ah)"/>
    <path d="M966 132H990" marker-end="url(#kp-ah)"/>
  </g>

  <!-- 01 Measure -->
  <g transform="translate(52 84)">
    <rect width="146" height="96" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="m" x="14" y="25" font-size="13" fill="#64748b">01</text>
    <circle cx="73" cy="37" r="22" fill="#d9f7f0"/>
    <g transform="translate(73 37)" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-9 -15H4L12 -7V12a3 3 0 0 1-3 3H-9a3 3 0 0 1-3-3V-12a3 3 0 0 1 3-3Z"/>
      <path d="M4 -15V-7H12M-6 -1H6M-6 4.5H6M-6 10H1"/>
    </g>
    <text class="s" x="73" y="82" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Measure</text>
    <text class="m" x="73" y="118" font-size="15" fill="#475569" text-anchor="middle"><tspan x="73">measure.json</tspan><tspan x="73" dy="18"><tspan fill="#0f766e">+</tspan> measure.md</tspan></text>
  </g>

  <!-- 02 Recommend -->
  <g transform="translate(242 84)">
    <rect width="146" height="96" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="m" x="14" y="25" font-size="13" fill="#64748b">02</text>
    <circle cx="73" cy="37" r="22" fill="#d9f7f0"/>
    <g transform="translate(73 37)" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-14 -8.5l3 3 5.5-6M-14 2.5l3 3 5.5-6M-14 13.5l3 3 5.5-6"/>
      <path d="M-1 -10H14M-1 1H10M-1 12H12"/>
    </g>
    <text class="s" x="73" y="82" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Recommend</text>
    <text class="m" x="73" y="118" font-size="15" fill="#475569" text-anchor="middle"><tspan x="73">30 recipes,</tspan><tspan x="73" dy="18">evidence-ranked</tspan></text>
  </g>

  <!-- 03 Choose -->
  <g transform="translate(432 84)">
    <rect width="146" height="96" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="m" x="14" y="25" font-size="13" fill="#64748b">03</text>
    <circle cx="73" cy="37" r="22" fill="#d9f7f0"/>
    <g transform="translate(73 37)" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-15" y="-15" width="30" height="14" rx="7" fill="#0f766e"/>
      <circle cx="8" cy="-8" r="4" fill="#d9f7f0" stroke="none"/>
      <rect x="-15" y="2" width="30" height="14" rx="7"/>
      <circle cx="-8" cy="9" r="3.4" fill="#0f766e" stroke="none"/>
    </g>
    <text class="s" x="73" y="82" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Choose</text>
    <text class="m" x="73" y="118" font-size="15" fill="#475569" text-anchor="middle"><tspan x="73">artifact <tspan fill="#0f766e">·</tspan> browser</tspan><tspan x="73" dy="18"><tspan fill="#0f766e">·</tspan> terminal</tspan></text>
  </g>

  <!-- 04 Apply -->
  <g transform="translate(622 84)">
    <rect width="146" height="96" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="m" x="14" y="25" font-size="13" fill="#64748b">04</text>
    <circle cx="73" cy="37" r="22" fill="#d9f7f0"/>
    <g transform="translate(73 37)" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-5 -4H8L14 2V13a3 3 0 0 1-3 3H-2a3 3 0 0 1-3-3Z"/>
      <path d="M8 -4V2H14M1 8H9M1 12.5H6"/>
      <path d="M-7.8 -14.0L-7.5 -16.9L-4.5 -16.9L-4.2 -14.0L-1.7 -13.0L0.6 -14.8L2.8 -12.6L1.0 -10.3L2.0 -7.8L4.9 -7.5L4.9 -4.5L2.0 -4.2L1.0 -1.7L2.8 0.6L0.6 2.8L-1.7 1.0L-4.2 2.0L-4.5 4.9L-7.5 4.9L-7.8 2.0L-10.3 1.0L-12.6 2.8L-14.8 0.6L-13.0 -1.7L-14.0 -4.2L-16.9 -4.5L-16.9 -7.5L-14.0 -7.8L-13.0 -10.3L-14.8 -12.6L-12.6 -14.8L-10.3 -13.0Z" fill="#d9f7f0" stroke-width="2"/>
      <circle cx="-6" cy="-6" r="2.6" stroke-width="2"/>
    </g>
    <text class="s" x="73" y="82" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Apply</text>
    <text class="m" x="73" y="118" font-size="15" fill="#475569" text-anchor="middle"><tspan x="73">settings.json,</tspan><tspan x="73" dy="18">hooks, CLAUDE.md</tspan></text>
  </g>

  <!-- 05 Verify -->
  <g transform="translate(812 84)">
    <rect width="146" height="96" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="m" x="14" y="25" font-size="13" fill="#64748b">05</text>
    <circle cx="73" cy="37" r="22" fill="#d9f7f0"/>
    <g transform="translate(73 37)" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -16L13 -11V0C13 8 7.5 13 0 16C-7.5 13 -13 8 -13 0V-11Z"/>
      <path d="M-5.5 0L-1.5 4L6 -4.5"/>
    </g>
    <text class="s" x="73" y="82" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Verify</text>
    <text class="m" x="73" y="118" font-size="15" fill="#475569" text-anchor="middle"><tspan x="73">self-tests,</tspan><tspan x="73" dy="18">validate</tspan></text>
  </g>

  <!-- 06 Undo -->
  <g transform="translate(1002 84)">
    <rect width="146" height="96" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="m" x="14" y="25" font-size="13" fill="#64748b">06</text>
    <circle cx="73" cy="37" r="22" fill="#d9f7f0"/>
    <g transform="translate(73 37)" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-11.75 4.28A12.5 12.5 0 1 0-8.84-8.84L-13.5-3"/>
      <path d="M-13.5-10V-3H-6.5"/>
    </g>
    <text class="s" x="73" y="82" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Undo</text>
    <text class="m" x="73" y="118" font-size="15" fill="#475569" text-anchor="middle"><tspan x="73">journal</tspan><tspan x="73" dy="18"><tspan fill="#0f766e">+</tspan> backups</tspan></text>
  </g>
</svg>
